name: "Build & Release"

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch: {}

env:
  FLUTTER_VERSION: 3.47.4

jobs:
  # L'app e' ora gratuita: viene compilato SOLO il target Windows.
  # Niente Shorebird, niente segreti degli store, niente submoduli privati.
  windows:
    name: Build & Release on Windows
    runs-on: windows-2025

    permissions:
      contents: write

    steps:
      #1 Checkout (SENZA `submodules: recursive`: il submodule privato `prop`
      # non serve, pubspec/lock puntano alla cartella vendorizzata prop_public).
      - name: Checkout Repository
        uses: actions/checkout@v4

      #2 Override completi e ALLINEATI (prop -> prop_public, universal_ble -> main).
      # Il file viene SOVRASCITTO (non aggiunto): cosi' anche se su GitHub il
      # pubspec_overrides.yaml committato fosse obsoleto (ref: changes), qui si
      # azzera ogni disallineamento tra app e prop. Se prop_public non esiste,
      # NON crea il file per non rompere setup alternativi.
      - name: Force aligned overrides (prop + universal_ble)
        shell: pwsh
        run: |
          if (-not (Test-Path "prop_public/pubspec.yaml")) {
            Write-Warning "prop_public non trovata: nessun override generato."
            exit 0
          }
          @"
          dependency_overrides:
            prop:
              path: prop_public
            universal_ble:
              git:
                url: https://github.com/jonasbark/universal_ble.git
                ref: main
          "@ | Set-Content -Path pubspec_overrides.yaml -Encoding utf8
          Write-Output "--- pubspec_overrides.yaml ---"
          Get-Content pubspec_overrides.yaml

      #2b Pulizia di eventuali residui del vecchio submodule privato `prop`:
      # impedisce l'errore "because every version of prop from path depends on
      # universal_ble ... at changes and bike_control depends on ... at main,
      # prop from path is forbidden" causato da ref diverse nella stessa riga
      # di dipendenza git.
      - name: Remove stale private prop checkout
        shell: bash
        run: |
          rm -rf prop .git/modules/prop || true
          git config --file .gitmodules --remove-section submodule.prop 2>/dev/null || true
          ls -d prop 2>/dev/null && echo "ATTENZIONE: cartella prop ancora presente" || echo "OK: nessun checkout 'prop' residuo"

      # Cache delle dipendenze pub: velocizza i run successivi e riduce il traffico di download.
      - name: Cache Pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            C:\Users\runneradmin\AppData\Local\Pub\Cache\hosted
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('pubspec.lock', 'pubspec_overrides.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}

      #3 Long paths su Windows (MAX_PATH) per evitare errori di checkout/cache.
      - name: Enable git long paths
        run: git config --system core.longpaths true

      - name: Generate translation files
        shell: pwsh
        run: |
          flutter pub global activate intl_utils
          flutter pub global run intl_utils:generate

      - name: Extract version from pubspec.yaml
        shell: pwsh
        run: |
          $version = Select-String '^version: ' pubspec.yaml | ForEach-Object {
            ($_ -split ' ')[1].Trim()
          }
          echo "VERSION=$version" >> $env:GITHUB_ENV

      #4 Build standard (niente Shorebird). SUPABASE_ANON_KEY e' facoltativo:
      # senza chiave la sola chat di supporto resta disattivata, tutto il resto funziona.
      - name: Flutter Release Windows
        run: >-
          flutter build windows --release --obfuscate --split-debug-info=symbols-win
          --dart-define=SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

      #5 DLL runtime MSVC per far girare l'exe anche su PC senza
      # Visual C++ Redistributable installato.
      - name: Copy MSVC runtime DLLs
        shell: pwsh
        run: |
          $source = "C:\Windows\System32"
          $destination = "build\windows\x64\runner\Release"
          foreach ($dll in @("msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll")) {
            $srcPath = Join-Path $source $dll
            if (Test-Path $srcPath) {
              Copy-Item -Path $srcPath -Destination (Join-Path $destination $dll) -Force
              Write-Output "Copied $dll"
            } else {
              Write-Warning "$dll not found in $source"
            }
          }

      #6 Zip portabile + zip simboli.
      - name: Create portable zip
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release | Out-Null

          $zipPath = "release\bike_control.windows.zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path "build/windows/x64/runner/Release/*" -DestinationPath $zipPath

          $symZip = "release\symbols-win.zip"
          if (Test-Path $symZip) { Remove-Item $symZip -Force }
          $symItems = @()
          if (Test-Path "symbols-win") { $symItems += "symbols-win/*" }
          $pdbs = @(Get-ChildItem "build/windows/x64/runner/Release/*.pdb" -ErrorAction SilentlyContinue | ForEach-Object { $_.FullName })
          if ($pdbs.Count -gt 0) { $symItems += $pdbs }
          if ($symItems.Count -gt 0) { Compress-Archive -Path $symItems -DestinationPath $symZip }

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          overwrite: true
          name: Windows Release
          path: release/bike_control.windows.zip

      #7 Pubblicazione della Release (usa il token del workflow: nessun segreto richiesto).
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versionLine = Select-String '^version: ' pubspec.yaml | ForEach-Object { ($_ -split ' ')[1].Trim() }
          $tag = "v$($versionLine -replace '\+.*$','')"
          $files = @("release\bike_control.windows.zip")
          if (Test-Path "release\symbols-win.zip") { $files += "release\symbols-win.zip" }
          $notes = "Build Windows gratuita: tutte le funzioni PRO sbloccate. Scarica bike_control.windows.zip, estrai la cartella e avvia BikeControl.exe."
          gh release create $tag --target $env:GITHUB_SHA --title "BikeControl $tag (Windows)" --notes $notes --prerelease @files
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag @files --clobber
          }
